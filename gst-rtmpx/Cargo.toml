[package]
name = "gst-rtmpx"
version = "0.3.0"
edition = "2024"
authors = ["Elliott Linder <elliott@linder.dev>"]
description = "GStreamer RTMP source and sink elements built on rtmpx"
license = "MIT OR Apache-2.0"
repository = "https://github.com/darfink/gst-rtmpx"

[lib]
name = "gstrtmpx"
crate-type = ["cdylib", "rlib"]

[features]
capi = []

[dependencies]
bytes = "1.12"
# Protocol sessions (client + server) come from the rtmpx crate on crates.io.
rtmpx = "3.0"
flume = "0.12"
gst = { package = "gstreamer", version = "0.25.3", features = ["v1_28"] }
gst-base = { package = "gstreamer-base", version = "0.25.3", features = ["v1_28"] }
tokio = { version = "1.53", features = ["macros", "net", "rt", "sync", "time", "io-util"] }
tokio-util = "0.7"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
rustls-native-certs = "0.8"

[dev-dependencies]
# Released v2 peers independently exercise RTMP wire compatibility.
rtmpx-legacy = { package = "rtmpx", version = "=2.0.0" }
gst-check = { package = "gstreamer-check", version = "0.25", features = ["v1_28"] }
rcgen = "0.14"

[build-dependencies]
gst-plugin-version-helper = "0.8.4"

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0, gstreamer-base-1.0, gobject-2.0, glib-2.0, gmodule-2.0"
